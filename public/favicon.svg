<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Glowing Geometric Logo: Monogram 'A' with code glyph -->
  <g filter="url(#glow)">
    <!-- Stylized 'A' chevron -->
    <path d="M32 14L45 46H38.5L35.5 38.5H28.5L25.5 46H19L32 14Z" fill="url(#neonGlow)" />
    <!-- Inner cutout -->
    <polygon points="32,23 29.8,32.5 34.2,32.5" fill="#06121E" />
    <!-- Cyan glow dot -->
    <circle cx="45" cy="46" r="3" fill="#22D3EE" />
  </g>
</svg>